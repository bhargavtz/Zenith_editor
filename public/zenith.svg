<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="zenithGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stylized "Z" as mountain peak representing Zenith -->
  <polygon points="20,75 50,25 80,75 65,75 50,50 35,75" fill="url(#zenithGrad)"/>
  <!-- Small star/spark at the peak -->
  <circle cx="50" cy="20" r="3" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
